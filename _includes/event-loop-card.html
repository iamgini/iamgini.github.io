<div class="card h-100 shadow-sm p-3">
  <div class="card-body d-flex flex-column p-0">
    <h5 class="card-title mb-2">
      <a class="text-dark" href="{{ event.url }}" target="_blank">{{ event.title }}</a>
    </h5>
    <p class="card-text small mb-3">
      <strong>Speakers:</strong> {{ event.speakers }}<br>
      {% if event.role == 'Host' %}
        <strong>Host:</strong> Gineesh Madapparambath<br>
      {% endif %}
      {{ event.event }} ({{ event.remarks }})
    </p>
    <div class="mt-auto">
      <small class="text-muted">{{ event.date | date: '%b %d, %Y' }}</small>
    </div>
  </div>
</div>
